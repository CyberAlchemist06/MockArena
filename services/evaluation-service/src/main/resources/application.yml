server:
  port: 8084
spring:
  application:
    name: evaluation-service
  datasource:
    url: ${EVALUATION_DATABASE_URL:jdbc:postgresql://localhost:5432/mockarena}
    username: ${EVALUATION_DATABASE_USERNAME:mockarena}
    password: ${EVALUATION_DATABASE_PASSWORD:mockarena}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: evaluation
    default-schema: evaluation
evaluation:
  security:
    enabled: ${EVALUATION_SECURITY_ENABLED:true}
  workload-auth:
    incoming-token: ${EVALUATION_SERVICE_WORKLOAD_TOKEN:}
    assessment-snapshot-token: ${ASSESSMENT_SNAPSHOT_WORKLOAD_TOKEN:}
    question-coding-token: ${QUESTION_CODING_EVALUATION_WORKLOAD_TOKEN:}
  preparation:
    enabled: ${EVALUATION_JOB_PREPARATION_ENABLED:true}
    fixed-delay-ms: ${EVALUATION_JOB_PREPARATION_DELAY_MS:5000}
assessment-service:
  base-url: ${ASSESSMENT_SERVICE_BASE_URL:http://localhost:8083}
question-service:
  base-url: ${QUESTION_SERVICE_BASE_URL:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
